{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="relative bg-teal-600 text-white py-24 md:py-32 overflow-hidden">

    <div class="container mx-auto px-4 text-center relative z-10">
        <h1 class="text-4xl md:text-6xl font-extrabold leading-tight tracking-tight mb-4">
            Unlock a World of Languages
        </h1>

        <p class="text-xl md:text-2xl mb-8 font-light max-w-2xl mx-auto">
            Start your journey to fluency with our expert-crafted lessons and interactive quizzes.
        </p>

        <a href="{% url 'sign_up' %}" class="bg-white text-teal-600 font-bold py-3 px-8 rounded-full text-lg shadow-lg hover:bg-gray-100 transition-colors duration-300">
            Start Learning
        </a>
    </div>

</div>


<div class="container mx-auto px-4 py-16">
    <h2 class="text-4xl font-bold text-gray-800 text-center mb-12">
        Explore Our Languages
    </h2>

    <div id="languages-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    </div>

</div>


<div class="bg-gray-100 py-16">
    <div class="container mx-auto px-4">
        <h2 class="text-4xl font-bold text-gray-800 text-center mb-12">
            What Our Learners Say
        </h2>

        <div id="reviews-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        </div>

    </div>
</div>

<script>
const languagesContainer = document.getElementById('languages-list');

const reviewsContainer = document.getElementById('reviews-list');

const languagesAPI = '/api/languages/';

const reviewsAPI = '/api/reviews/';

async function fetchLanguages() {

    try {
        const response = await fetch(languagesAPI);
        const languages = await response.json();
        languagesContainer.innerHTML = '';

        languages.forEach(lang => {

            const langDiv = document.createElement('a');
            langDiv.href = `/languages/${lang.id}/`;
            langDiv.className = "relative group block rounded-xl shadow-lg hover:shadow-2xl transition-shadow duration-300 overflow-hidden";

            let imageSrc = '{% static "images/placeholder.jpg" %}';

            if (lang.name === 'Swahili') imageSrc = '{% static "images/swahili.png" %}';
            if (lang.name === 'French') imageSrc = '{% static "images/france.png" %}';
            if (lang.name === 'Spanish') imageSrc = '{% static "images/spanish.png" %}';
            if (lang.name === 'Italian') imageSrc = '{% static "images/italy.png" %}';

            langDiv.innerHTML = `
                <img src="${imageSrc}" alt="${lang.name}" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out">

                <div class="absolute inset-0 bg-black bg-opacity-10 group-hover:bg-opacity-20 transition-colors duration-300"></div>

                <div class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center text-white relative z-10">
                    <h3 class="text-3xl font-bold text-gray-500">${lang.name}</h3>
                    <p class="text-sm text-gray-600 mt-2 transform translate-y-full opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500">
                        ${lang.description || ''}
                    </p>
                    <span class="mt-4 text-blue-500 inline-block font-semibold border-b-2 border-white pb-1">
                        View Lessons &rarr;
                    </span>

                </div>
            `;
            languagesContainer.appendChild(langDiv);
        });
    } catch (error) {
        console.error('Error fetching languages:', error);
        languagesContainer.innerHTML = '<p class="col-span-full text-center text-gray-500">Failed to load languages.</p>';
    }
}

async function fetchReviews() {
    try {
        const response = await fetch(reviewsAPI);
        const reviews = await response.json();
        reviewsContainer.innerHTML = '';

        reviews.forEach(review => {
            const reviewDiv = document.createElement('div');
            reviewDiv.className = "bg-white rounded-xl shadow-lg p-8 transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl relative overflow-hidden";

            let starsHTML = '';

            for (let i=1; i<=5; i++){
            
                if(i <= review.rating){
                    starsHTML += `<svg class="h-5 w-5 fill-current text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>`;
                } else {
                    starsHTML += `<svg class="h-5 w-5 fill-current text-gray-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>`;
                }
            }

            reviewDiv.innerHTML = `
                <div class="flex items-center text-yellow-500 mb-4">${starsHTML}</div>
                <p class="text-gray-700 mb-4 italic">"${review.text}"</p>
                <p class="text-sm font-semibold text-gray-800">- ${review.author}</p>
            `;

            reviewsContainer.appendChild(reviewDiv);
        });
    } catch (error) {
        console.error('Error fetching reviews:', error);
        reviewsContainer.innerHTML = '<p class="col-span-full text-center text-gray-500">Failed to load reviews.</p>';
    }
}

// Fetch data
fetchLanguages();
fetchReviews();
</script>
{% endblock %}
